[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
; plus de place pour le programme (Wi-Fi + mise à jour sans câble) : 2 x 1,9 Mo
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0
; versions exactes : une mise à jour ne change jamais le jeu sans qu'on le décide
lib_deps =
    fastled/FastLED@3.10.8
    olikraus/U8g2@2.36.18

; Mise à jour sans câble : ouvrir l'Atelier sur la borne, connecter l'ordinateur au Wi-Fi « Mini-arcade »,
; puis lancer : ARCADE_PASS=<mot de passe affiché sur l'OLED> pio run -e ota -t upload
[env:ota]
extends = env:esp32dev
upload_protocol = espota
upload_port = 192.168.4.1
upload_flags = --auth=${sysenv.ARCADE_PASS}
